name: Download Dukascopy tick data

on:
  workflow_dispatch:
    inputs:
      instrument:
        description: "Instrument (e.g. EURUSD)"
        required: true
        default: "EURUSD"
      from:
        description: "Start, GMT — YYYY-MM-DD HH:mm:ss"
        required: true
        default: "2025-01-01 00:00:00"
      to:
        description: "End, GMT — YYYY-MM-DD HH:mm:ss"
        required: true
        default: "2025-01-02 00:00:00"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Prepare names
        id: meta
        run: |
          FROM_DATE=$(echo "${{ inputs.from }}" | cut -d' ' -f1)
          TO_DATE=$(echo "${{ inputs.to }}" | cut -d' ' -f1)
          SLUG=$(echo "${{ inputs.instrument }}" | tr 'A-Z' 'a-z')-ticks-${FROM_DATE}-to-${TO_DATE}
          echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"
          echo "from_date=${FROM_DATE}" >> "$GITHUB_OUTPUT"
          echo "to_date=${TO_DATE}" >> "$GITHUB_OUTPUT"

      - name: Download ticks
        run: |
          npx -y dukascopy-node \
            -i "${{ inputs.instrument }}" \
            -from "${{ steps.meta.outputs.from_date }}" \
            -to "${{ steps.meta.outputs.to_date }}" \
            -t tick \
            -f csv

      - name: Convert CSV to JForex format (GMT)
        run: |
          python convert.py "${{ steps.meta.outputs.slug }}.csv"

      - name: Zip CSV (reduce size)
        run: |
          zip -9 -j \
            "${{ steps.meta.outputs.slug }}.zip" \
            "${{ steps.meta.outputs.slug }}.csv"

      # ========== آپلود به GoFile ==========
      - name: Upload to GoFile
        id: gofile
        run: |
          FILE="${{ steps.meta.outputs.slug }}.zip"
          
          echo "Getting best GoFile server..."
          SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name')
          echo "Using server: $SERVER"
          
          echo "Uploading $FILE to GoFile..."
          RESPONSE=$(curl -s -X POST \
            "https://${SERVER}.gofile.io/contents/uploadfile" \
            -F "file=@${FILE}")
          
          echo "$RESPONSE" | jq .
          
          DOWNLOAD_PAGE=$(echo "$RESPONSE" | jq -r '.data.downloadPage')
          
          if [ -z "$DOWNLOAD_PAGE" ] || [ "$DOWNLOAD_PAGE" = "null" ]; then
            echo "❌ Upload to GoFile failed!"
            exit 1
          fi
          
          echo "download_page=$DOWNLOAD_PAGE" >> $GITHUB_OUTPUT
          echo "✅ Upload successful!"
          echo "Download Page: $DOWNLOAD_PAGE"

      - name: Show GoFile Link
        run: |
          echo "=========================================="
          echo "لینک دانلود GoFile:"
          echo "${{ steps.gofile.outputs.download_page }}"
          echo "=========================================="

      # ========== ارسال لینک به تلگرام (اختیاری) ==========
      # برای فعال کردن این بخش، دو Secret زیر را در ریپو تنظیم کن:
      # TELEGRAM_BOT_TOKEN و TELEGRAM_CHAT_ID
      - name: Send link to Telegram
        if: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          LINK="${{ steps.gofile.outputs.download_page }}"
          MESSAGE="✅ فایل آماده شد

Instrument: ${{ inputs.instrument }}
From: ${{ steps.meta.outputs.from_date }}
To: ${{ steps.meta.outputs.to_date }}

🔗 لینک دانلود:
${LINK}"

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="${MESSAGE}" \
            -d parse_mode="HTML"
