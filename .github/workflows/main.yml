name: Download Dukascopy tick data

on:
  workflow_dispatch:
    inputs:
      instrument:
        description: "Instrument (e.g. EURUSD)"
        required: true
        default: "EURUSD"
      from:
        description: "Start, GMT — YYYY-MM-DD HH:mm:ss"
        required: true
        default: "2025-01-01 00:00:00"
      to:
        description: "End, GMT — YYYY-MM-DD HH:mm:ss"
        required: true
        default: "2025-01-02 00:00:00"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare names
        id: meta
        run: |
          FROM_DATE=$(echo "${{ inputs.from }}" | cut -d' ' -f1)
          TO_DATE=$(echo "${{ inputs.to }}" | cut -d' ' -f1)

          SLUG=$(echo "${{ inputs.instrument }}" | tr 'A-Z' 'a-z')-ticks-${FROM_DATE}-to-${TO_DATE}

          echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"
          echo "from_date=${FROM_DATE}" >> "$GITHUB_OUTPUT"
          echo "to_date=${TO_DATE}" >> "$GITHUB_OUTPUT"

      - name: Download ticks
        run: |
          npx -y dukascopy-node \
            -i "${{ inputs.instrument }}" \
            -from "${{ steps.meta.outputs.from_date }}" \
            -to "${{ steps.meta.outputs.to_date }}" \
            -t tick \
            -f csv

      - name: Convert CSV to JForex format (GMT)
        run: |
          python convert.py "${{ steps.meta.outputs.slug }}.csv"

      - name: Compress and split CSV
  run: |
    zip -9 "${{ steps.meta.outputs.slug }}.zip" \
      "${{ steps.meta.outputs.slug }}.csv"

    split -b 1500M \
      "${{ steps.meta.outputs.slug }}.zip" \
      "${{ steps.meta.outputs.slug }}.zip.part-"

    rm "${{ steps.meta.outputs.slug }}.zip"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.slug }}
          name: ${{ inputs.instrument }} ticks ${{ steps.meta.outputs.from_date }} to ${{ steps.meta.outputs.to_date }}
          files: ./${{ steps.meta.outputs.slug }}.zip
