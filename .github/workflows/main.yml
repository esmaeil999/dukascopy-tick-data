name: Download Dukascopy Tick Data

on:
workflow_dispatch:
inputs:
instrument:
description: "Instrument"
required: true
default: "EURUSD"
start_date:
description: "Start date YYYY-MM-DD"
required: true
default: "2025-01-01"
end_date:
description: "End date YYYY-MM-DD"
required: true
default: "2025-01-02"

permissions:
contents: write

jobs:
download:
runs-on: ubuntu-latest
timeout-minutes: 350

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: "24"

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Prepare inputs
    id: meta
    shell: bash
    env:
      INPUT_INSTRUMENT: ${{ inputs.instrument }}
      INPUT_START: ${{ inputs.start_date }}
      INPUT_END: ${{ inputs.end_date }}
    run: |
      set -e

      INSTRUMENT=$(printf '%s' "$INPUT_INSTRUMENT" | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]')
      FROM_DATE=$(printf '%s' "$INPUT_START" | tr -d '[:space:]')
      TO_DATE=$(printf '%s' "$INPUT_END" | tr -d '[:space:]')

      INSTRUMENT_LOWER=$(printf '%s' "$INSTRUMENT" | tr '[:upper:]' '[:lower:]')

      SLUG="${INSTRUMENT_LOWER}-ticks-${FROM_DATE}-to-${TO_DATE}"

      echo "Instrument: $INSTRUMENT"
      echo "From: $FROM_DATE"
      echo "To: $TO_DATE"
      echo "Slug: $SLUG"

      echo "instrument=$INSTRUMENT" >> "$GITHUB_OUTPUT"
      echo "from_date=$FROM_DATE" >> "$GITHUB_OUTPUT"
      echo "to_date=$TO_DATE" >> "$GITHUB_OUTPUT"
      echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

  - name: Download ticks
    shell: bash
    run: |
      set -e

      npx -y dukascopy-node \
        -i "${{ steps.meta.outputs.instrument }}" \
        -from "${{ steps.meta.outputs.from_date }}" \
        -to "${{ steps.meta.outputs.to_date }}" \
        -t tick \
        -f csv

  - name: Show downloaded files
    shell: bash
    run: |
      echo "Downloaded files:"
      ls -lah

  - name: Convert CSV
    shell: bash
    run: |
      set -e

      FILE="${{ steps.meta.outputs.slug }}.csv"

      if [ ! -f "$FILE" ]; then
        echo "ERROR: CSV file not found:"
        echo "$FILE"
        echo ""
        echo "Available files:"
        ls -lah
        exit 1
      fi

      python convert.py "$FILE"

  - name: Zip CSV
    shell: bash
    run: |
      set -e

      CSV_FILE="${{ steps.meta.outputs.slug }}.csv"
      ZIP_FILE="${{ steps.meta.outputs.slug }}.zip"

      zip -9 -j "$ZIP_FILE" "$CSV_FILE"

      echo "Created ZIP:"
      ls -lh "$ZIP_FILE"

  - name: Split ZIP if larger than 1.9GB
    shell: bash
    run: |
      set -e

      FILE="${{ steps.meta.outputs.slug }}.zip"
      LIMIT=$((1900 * 1024 * 1024))

      SIZE=$(stat -c%s "$FILE")

      echo "ZIP size: $SIZE bytes"
      echo "Limit: $LIMIT bytes"

      if [ "$SIZE" -gt "$LIMIT" ]; then
        echo "ZIP is larger than 1.9GB. Splitting..."

        split -b 1900M "$FILE" "${FILE}."

        rm "$FILE"

        echo "Created parts:"
        ls -lh "${FILE}".*
      else
        echo "ZIP is smaller than 1.9GB. No splitting required."
      fi

  - name: Publish to GitHub Release
    uses: softprops/action-gh-release@v2
    with:
      tag_name: ${{ steps.meta.outputs.slug }}
      name: ${{ steps.meta.outputs.instrument }} ticks ${{ steps.meta.outputs.from_date }} to ${{ steps.meta.outputs.to_date }}
      generate_release_notes: false
      files: |
        ./${{ steps.meta.outputs.slug }}.zip
        ./${{ steps.meta.outputs.slug }}.zip.*
```
