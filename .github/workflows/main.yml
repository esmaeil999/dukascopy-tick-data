name: Download Dukascopy Tick Data

on:
  workflow_dispatch:
    inputs:
      instrument:
        description: "Instrument"
        required: true
        default: "EURUSD"
        type: string
      from:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2025-01-01"
        type: string
      to:
        description: "End date (YYYY-MM-DD)"
        required: true
        default: "2025-01-02"
        type: string
      chat_id:
        description: "Telegram Chat ID"
        required: true
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare inputs
        id: meta
        run: |
          INSTRUMENT=$(echo "${{ inputs.instrument }}" | tr '[:lower:]' '[:upper:]' | tr -d ' ')
          FROM_DATE=$(echo "${{ inputs.from }}" | cut -d' ' -f1)
          TO_DATE=$(echo "${{ inputs.to }}" | cut -d' ' -f1)
          INSTRUMENT_LOWER=$(echo "$INSTRUMENT" | tr '[:upper:]' '[:lower:]')
          SLUG="${INSTRUMENT_LOWER}-ticks-${FROM_DATE}-to-${TO_DATE}"

          echo "instrument=$INSTRUMENT_LOWER" >> $GITHUB_OUTPUT
          echo "instrument_upper=$INSTRUMENT" >> $GITHUB_OUTPUT
          echo "from_date=$FROM_DATE" >> $GITHUB_OUTPUT
          echo "to_date=$TO_DATE" >> $GITHUB_OUTPUT
          echo "slug=$SLUG" >> $GITHUB_OUTPUT

      - name: Download ticks
        run: |
          mkdir -p download
          npx -y dukascopy-node \
            -i "${{ steps.meta.outputs.instrument }}" \
            -from "${{ steps.meta.outputs.from_date }}" \
            -to "${{ steps.meta.outputs.to_date }}" \
            -t tick \
            -f csv \
            -dir "./download"

      - name: Find and prepare CSV
        run: |
          CSV_FILE=$(find download -name "*.csv" | head -n 1)
          if [ -z "$CSV_FILE" ]; then
            echo "No CSV file found"
            exit 1
          fi
          cp "$CSV_FILE" "${{ steps.meta.outputs.slug }}.csv"

      - name: Convert to JForex format
        run: python convert.py "${{ steps.meta.outputs.slug }}.csv"

      - name: Create ZIP
        run: zip -9 -j "${{ steps.meta.outputs.slug }}.zip" "${{ steps.meta.outputs.slug }}.csv"

      - name: Upload to transfer.sh
        id: upload
        run: |
          FILE="${{ steps.meta.outputs.slug }}.zip"
          UPLOAD_URL=$(curl --upload-file "$FILE" "https://transfer.sh/$(basename $FILE)")
          echo "url=$UPLOAD_URL" >> $GITHUB_OUTPUT
          echo "Uploaded to: $UPLOAD_URL"

      - name: Notify Telegram
        if: success()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
          URL: ${{ steps.upload.outputs.url }}
          INSTRUMENT: ${{ steps.meta.outputs.instrument_upper }}
          FROM: ${{ steps.meta.outputs.from_date }}
          TO: ${{ steps.meta.outputs.to_date }}
        run: |
          MESSAGE="✅ Download completed!

Instrument: *${INSTRUMENT}*
From: \`${FROM}\`
To: \`${TO}\`

📥 Download:
${URL}"

          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="${MESSAGE}" \
            -d parse_mode="Markdown"
