name: Download Dukascopy tick data

on:
  workflow_dispatch:
    inputs:
      instrument:
        description: "Instrument (e.g. EURUSD)"
        required: true
        default: "EURUSD"
      from:
        description: "Start date (YYYY-MM-DD)"
        required: true
      to:
        description: "End date (YYYY-MM-DD)"
        required: true
      chat_id:
        description: "Telegram Chat ID"
        required: true

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Prepare names
        id: meta
        run: |
          SLUG=$(echo "${{ inputs.instrument }}" | tr 'A-Z' 'a-z')-ticks-${{ inputs.from }}-to-${{ inputs.to }}
          echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"

      - name: Download ticks
        run: |
          npx -y dukascopy-node \
            -i "${{ inputs.instrument }}" \
            -from "${{ inputs.from }}" \
            -to "${{ inputs.to }}" \
            -t tick \
            -f csv

      - name: Convert CSV to JForex format (GMT)
        run: |
          python convert.py "${{ steps.meta.outputs.slug }}.csv"

      - name: Zip CSV
        run: |
          zip -9 -j \
            "${{ steps.meta.outputs.slug }}.zip" \
            "${{ steps.meta.outputs.slug }}.csv"

      - name: Upload to GoFile
        id: gofile
        run: |
          FILE="${{ steps.meta.outputs.slug }}.zip"
          
          SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name')
          echo "Using server: $SERVER"
          
          RESPONSE=$(curl -s -X POST \
            "https://${SERVER}.gofile.io/contents/uploadfile" \
            -F "file=@${FILE}")
          
          echo "$RESPONSE" | jq .
          
          DOWNLOAD_PAGE=$(echo "$RESPONSE" | jq -r '.data.downloadPage')
          
          if [ -z "$DOWNLOAD_PAGE" ] || [ "$DOWNLOAD_PAGE" = "null" ]; then
            echo "Upload failed!"
            exit 1
          fi
          
          echo "download_page=$DOWNLOAD_PAGE" >> $GITHUB_OUTPUT
          echo "Download Page: $DOWNLOAD_PAGE"

      - name: Send link to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          LINK="${{ steps.gofile.outputs.download_page }}"
          
          MESSAGE="✅ فایل آماده شد%0A%0Aجفت ارز: ${{ inputs.instrument }}%0Aاز تاریخ: ${{ inputs.from }}%0Aتا تاریخ: ${{ inputs.to }}%0A%0A🔗 لینک دانلود:%0A${LINK}"
          
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${{ inputs.chat_id }}" \
            -d text="${MESSAGE}"
