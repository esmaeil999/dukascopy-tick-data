name: Download Dukascopy tick data

on:
  workflow_dispatch:
    inputs:
      instrument:
        description: "Instrument (e.g. EURUSD)"
        required: true
        default: "EURUSD"
      from:
        description: "Start date (YYYY-MM-DD)"
        required: true
      to:
        description: "End date (YYYY-MM-DD)"
        required: true
      chat_id:
        description: "Telegram Chat ID"
        required: true

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare names
        id: meta
        run: |
          SLUG=$(echo "${{ inputs.instrument }}" | tr 'A-Z' 'a-z')-ticks-${{ inputs.from }}-to-${{ inputs.to }}
          echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"

      - name: Download ticks
        run: |
          npx -y dukascopy-node \
            -i "${{ inputs.instrument }}" \
            -from "${{ inputs.from }}" \
            -to "${{ inputs.to }}" \
            -t tick \
            -f csv

      - name: Convert CSV to JForex format (GMT)
        run: |
          python convert.py "${{ steps.meta.outputs.slug }}.csv"

      - name: Zip CSV
        run: |
          zip -9 -j \
            "${{ steps.meta.outputs.slug }}.zip" \
            "${{ steps.meta.outputs.slug }}.csv"

      - name: Split if larger than 1.9GB
        id: split
        run: |
          FILE="${{ steps.meta.outputs.slug }}.zip"
          SIZE=$(stat -c%s "$FILE")
          LIMIT=$((1900 * 1024 * 1024))   # 1.9 GB
          
          echo "File size: $SIZE bytes"
          
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "File is larger than 1.9GB → splitting..."
            split -b 1900M "$FILE" "${FILE}."
            rm "$FILE"
            echo "split=true" >> $GITHUB_OUTPUT
            ls -lh ${FILE}.*
          else
            echo "File is under limit"
            echo "split=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.slug }}
          name: ${{ inputs.instrument }} ticks ${{ inputs.from }} to ${{ inputs.to }}
          body: |
            Instrument: ${{ inputs.instrument }}
            From: ${{ inputs.from }}
            To: ${{ inputs.to }}
            
            برای یکی کردن فایل‌های تقسیم‌شده:
            ```bash
            cat ${{ steps.meta.outputs.slug }}.zip.* > ${{ steps.meta.outputs.slug }}.zip
